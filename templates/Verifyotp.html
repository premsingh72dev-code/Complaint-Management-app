<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>

     <!-- Favicons -->
     <link href="static/img/facvicon.svg" rel="icon">
     <link href="static/img/facvicon.svg" rel="icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .otp-container {
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .otp-logo {
            width: 80px;
            margin-bottom: 15px;
        }

        .otp-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        .otp-message {
            color: #555;
            font-size: 15px;
            margin-bottom: 15px;
        }

        .otp-subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .otp-inputs input {
            width: 50px;
            height: 60px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: all 0.3s ease-in-out;
        }

        .otp-inputs input:focus {
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.5);
            transform: scale(1.1);
        }

        .otp-button {
            width: 100%;
            font-size: 18px;
            padding: 10px;
            border-radius: 8px;
        }

        .resend-link {
            display: block;
            margin-top: 10px;
            font-size: 14px;
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .resend-link:hover {
            text-decoration: underline;
        }

        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <div class="otp-container">
        <!-- Company Logo -->
        <img src="static/img/logo.jpg" alt="Company Logo" class="otp-logo">

        <h3 class="otp-title">OTP Verification</h3>
        <p class="otp-message">Check your this email ID: <strong>{{user}}</strong></p>
        <p class="otp-subtitle">Enter the 6-digit code sent to your email</p>

        <form id="otpvalidateform" onsubmit="return validateOTP()">
            <div class="otp-inputs">
                <input type="text" name="OTP1" id="otp1" maxlength="1" oninput="moveNext(this, 1)"
                    onkeydown="handleBackspace(this, 0)">
                <input type="text" name="OTP2" id="otp2" maxlength="1" oninput="moveNext(this, 2)"
                    onkeydown="handleBackspace(this, 1)">
                <input type="text" name="OTP3" id="otp3" maxlength="1" oninput="moveNext(this, 3)"
                    onkeydown="handleBackspace(this, 2)">
                <input type="text" name="OTP4" id="otp4" maxlength="1" oninput="moveNext(this, 4)"
                    onkeydown="handleBackspace(this, 3)">
                <input type="text" name="OTP5" id="otp5" maxlength="1" oninput="moveNext(this, 5)"
                    onkeydown="handleBackspace(this, 4)">
                <input type="text" name="OTP6" id="otp6" maxlength="1" oninput="moveNext(this, 6)"
                    onkeydown="handleBackspace(this, 5)">
            </div <p id="error-message" class="error-message">
            </p>
            <button type="submit" class="btn btn-primary otp-button">Verify OTP</button>
            <a href="/login" class="resend-link">Back to login</a>
        </form>
    </div>



    <!-- Vendor Files -->
    <script src="static/vendor/ajax/ajax.js"></script>
    <script src="static/vendor/jquery/jquery.js"></script>

    <script>

        const today = new Date();
        const year = today.getFullYear();
        $("#yearname").text(year);

        function moveNext(input, index) {
            let value = input.value;
            if (value.length === 1) {
                let nextInput = document.querySelectorAll(".otp-inputs input")[index];
                if (nextInput) {
                    nextInput.focus();
                }
            }
        }

        function handleBackspace(input, index) {
            if (event.key === "Backspace" && input.value === "") {
                let previousInput = document.querySelectorAll(".otp-inputs input")[index - 1];
                if (previousInput) {
                    previousInput.focus();
                    previousInput.value = "";
                }
            }
        }

        function validateOTP() {
            let otpInputs = document.querySelectorAll(".otp-inputs input");
            let otp = "";
            otpInputs.forEach(input => otp += input.value);

            let errorMessage = document.getElementById("error-message");

            if (otp.length !== 6 || isNaN(otp)) {
                errorMessage.textContent = "Please enter a valid 6-digit OTP.";
                return false;
            }
            return true;
        }


        //  <!----------------------      OTP Validate Form  ------------------------->


        $("#otpvalidateform").submit(function (e) {
            e.preventDefault();
            let usermail = "{{user}}"
            let otp1 = $("#otp1").val();
            let otp2 = $("#otp2").val();
            let otp3 = $("#otp3").val();
            let otp4 = $("#otp4").val();
            let otp5 = $("#otp5").val();
            let otp6 = $("#otp6").val();

            let forget_otp = otp1 + otp2 + otp3 + otp4 + otp5 + otp6
            $.ajax({
                url: "/verifyuserOtpvalidate",
                method: "POST",
                data: {
                    'forget_OTP': forget_otp,
                    'email': usermail,
                },
                dataType: 'json',
                success: function (res) {
                    if (res.res == "error") {
                        window.location.href = "/forgetpassword"
                    } else if (res.res == "success") {
                        alert("OTP Successfully Verified")
                        window.location.href = `/changepassword?args=${usermail}`
                    } else if (res.res == "Invalid OTP") {
                        alert("Please Enter Corrent OTP")
                    }

                },
                error: function (err) {
                    console.log("Error is: ", err);
                }
            });

        });


    </script>

</body>

</html>
