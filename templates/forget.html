<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Portal</title>

    <!-- Favicons -->
    <link href="static/img/facvicon.svg" rel="icon">
    <link href="static/img/facvicon.svg" rel="icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            align-items: center;
        }

        .forget-container {
            max-width: 900px;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            min-height: 400px;
        }

        .forget-image {
            max-width: 100%;
            border-radius: 10px;
            height: 100%;
            object-fit: cover;
        }

        .company-details {
            margin-top: 20px;
            text-align: center;
            color: white;
        }

        .company-details a {
            color: white;
            text-decoration: none;
        }

        .company-details a:hover {
            text-decoration: underline;
        }


        .forget-form {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 forget-container">
                <div class="row">
                    <div class="col-md-6 d-flex align-items-center">
                        <img src="https://merriam-webster.com/assets/mw/images/article/art-wap-landing-mp-lg/train-3448-72edc8c66df509608c1e13f712a1436e@1x.jpg"
                            alt="Forget Password Illustration" class="forget-image">
                    </div>
                    <div class="col-md-6 d-flex flex-column justify-content-center">
                        <div class="text-center">
                            <img src="static/img/logo.jpg" alt="Logo" width="120">
                            <h3 class="mt-3">Forgot Password</h3>
                            <p class="text-muted">Enter your email to reset your password.</p>
                        </div>
                        <form class="forget-form">
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" name="Email" placeholder="Enter your email"
                                    id="usermail">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mt-3">Reset Password</button>
                        </form>
                        <a href="/login" class="d-block text-center mt-3 text-decoration-none">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="company-details">
            <span>Designed By <a href="mailto:anshjha@photonstar.in">PhotonStar</a> </span>
            <p>&copy; <span id="yearname"></span> . All rights reserved.</p>
        </div>
    </div>
</body>

<!-- Vendor Files -->
<script src="static/vendor/ajax/ajax.js"></script>
<script src="static/vendor/jquery/jquery.js"></script>

<script>

    const today = new Date();
    const year = today.getFullYear();
    $("#yearname").text(year);

    $(".forget-form").submit(function (e) {
        e.preventDefault()
        let email = $("#usermail").val();
        console.log("Email is: ", email);

        $.ajax({
            url: '/checkUseraccountisvalid',
            method: "POST",
            data: {
                "Email": email
            },
            dataType: 'json',
            success: function (res) {
                console.log("Response is: ", res);
                if (res.res == "success") {
                    window.location.href = `/CheckOtpvalidation?Usermail=${res.msg}`
                } else if (res.res == "error") {
                    alert('Email is is Not Valid, Please check')
                }
            }

        })

    });

</script>

</html>
