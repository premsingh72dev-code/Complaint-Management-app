<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Portal</title>

    <!-- Favicons -->
    <link href="static/img/facvicon.svg" rel="icon">
    <link href="static/img/facvicon.svg" rel="apple-touch-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background: linear-gradient(to right, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            align-items: center;
        }

        .change-container {
            max-width: 900px;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            min-height: 400px;
        }

        .change-image {
            max-width: 100%;
            border-radius: 10px;
            height: 100%;
            object-fit: cover;
        }

        .company-details {
            margin-top: 20px;
            text-align: center;
            color: white;
        }

        .company-details a {
            color: white;
            text-decoration: none;
        }

        .company-details a:hover {
            text-decoration: underline;
        }

        .change-form {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }

        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 40px;
            /* Ensures the eye icon doesn't overlap the text */
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 70%;
            transform: translateY(-50%);
            cursor: pointer;
            color: gray;
            font-size: 18px;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 change-container">
                <div class="row">
                    <div class="col-md-6 d-flex align-items-center">
                        <img src="https://merriam-webster.com/assets/mw/images/article/art-wap-landing-mp-lg/train-3448-72edc8c66df509608c1e13f712a1436e@1x.jpg"
                            alt="Change Password Illustration" class="change-image">
                    </div>
                    <div class="col-md-6 d-flex flex-column justify-content-center">
                        <div class="text-center">
                            <img src="static/img/logo.jpg" alt="Logo" width="120">
                            <h3 class="mt-3">Change Password</h3>
                            <p class="text-muted">Set a new password for your account.</p>
                        </div>
                        <form id="masteradminpasswordupdate" class="change-form" onsubmit="return validatePasswords()">
                            <div class="mb-3 password-container">
                                <label class="form-label">New Password</label>
                                <input type="password" id="password" class="form-control"
                                    placeholder="Enter new password" name="password" required minlength="6">
                                <i class="fas fa-eye toggle-password" onclick="togglePassword('password')"></i>
                            </div>
                            <div class="mb-3 password-container">
                                <label class="form-label">Confirm Password</label>
                                <input type="password" id="confirm-password" class="form-control"
                                    name="confirm password" placeholder="Confirm new password" required>
                                <i class="fas fa-eye toggle-password" onclick="togglePassword('confirm-password')"></i>
                            </div>
                            <p id="error-message" class="text-danger text-center"></p>
                            <button type="submit" class="btn btn-primary w-100 mt-3">Update Password</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="company-details">
            <span>Designed By <a href="mailto:">PhotonStar</a> </span>
            <p>&copy; <span id="yearname"></span> . All rights reserved.</p>
        </div>
    </div>

    <!-- Vendor Files -->
    <script src="static/vendor/ajax/ajax.js"></script>
    <script src="static/vendor/jquery/jquery.js"></script>

    <script>

        const today = new Date();
        const year = today.getFullYear();
        $("#yearname").text(year);

        function togglePassword(id) {
            var input = document.getElementById(id);
            var icon = input.nextElementSibling;

            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        function validatePasswords() {
            var password = document.getElementById("password").value;
            var confirmPassword = document.getElementById("confirm-password").value;
            var errorMessage = document.getElementById("error-message");

            if (password.length < 6) {
                errorMessage.textContent = "Password must be at least 6 characters.";
                return false;
            }
            if (password !== confirmPassword) {
                errorMessage.textContent = "Passwords do not match!";
                return false;
            }
            return true;
        }

        $("#masteradminpasswordupdate").submit(function (e) {
            e.preventDefault();

            let email = "{{usermail}}"

            let formdata = $(this).serializeArray();
            formdata.push({ 'name': 'Email', value: email })
            $.ajax({
                url: "/updatemasterPassword",
                method: "POST",
                data: formdata,
                dataType: 'json',
                success: function (res) {
                    console.log("The response is: ", res);
                    if (res.res == "success") {
                        alert("Password Successfully Updated ! please login")
                        window.location.href = "/login"
                    } else if (res.res == "Invalid Password") {
                        alert(`${res.msg}`)
                    } else if (res.res = "error") {
                        alert("Something went wrong, try again after sometime")
                        window.location.href = "/login"
                    }
                }
            })
        })

    </script>
</body>

</html>
