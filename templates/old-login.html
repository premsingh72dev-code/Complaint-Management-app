<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            align-items: center;
        }

        .login-container {
            max-width: 900px;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            min-height: 500px;
        }

        .login-image {
            max-width: 100%;
            border-radius: 10px;
            height: 100%;
            object-fit: cover;
        }

        .company-details {
            margin-top: 20px;
            text-align: center;
            color: white;
        }

        .company-details a {
            color: white;
            text-decoration: none;
        }

        .company-details a:hover {
            text-decoration: underline;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }

        .forgot-password {
            display: block;
            text-align: right;
            margin-top: 5px;
            color: #667eea;
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 login-container">
                <div class="row">
                    <div class="col-md-6 d-flex align-items-center">
                        <img src="https://merriam-webster.com/assets/mw/images/article/art-wap-landing-mp-lg/train-3448-72edc8c66df509608c1e13f712a1436e@1x.jpg"
                            alt="Login Illustration" class="login-image">
                    </div>
                    <div class="col-md-6 d-flex flex-column justify-content-center">
                        <div class="text-center">
                            <img src="static/img/logo.jpg" alt="Logo" width="120">
                            <h3 class="mt-3">Welcome to Sahayta</h3>
                        </div>
                        <form class="login-form" id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="Enter email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Enter password"
                                    required minlength="6">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mt-3">Login</button>
                        </form>
                        <a href="/forgetpassword" class="forgot-password">Forgot Password?</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="company-details">
            <span>Designed By <a href="mailto:anshjha@photonstar.in">PhotonStar</span>
            <span>&copy; <span id="yearname"></span>. All rights reserved.</span>
        </div>
    </div>


    <!-- Vendor Files -->zx
    <script src="static/vendor/ajax/ajax.js"></script>
    <script src="static/vendor/jquery/jquery.js"></script>

    <script>

        const today = new Date();
        const year = today.getFullYear();
        $("#yearname").text(year);

        document.getElementById("loginForm").addEventListener("submit", function (event) {
            event.preventDefault();
            let email = document.getElementById("email");
            let password = document.getElementById("password");

            if (!email.checkValidity()) {
                email.classList.add("is-invalid");
            } else {
                email.classList.remove("is-invalid");
            }

            if (!password.checkValidity()) {
                password.classList.add("is-invalid");
            } else {
                password.classList.remove("is-invalid");
            }
        });

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            $("#submit_btn").prop("disabled", true);
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (email && password) {
                $.ajax({
                    url: "/loginverification",
                    method: "POST",
                    dataType: "json",
                    data: {
                        "email": email,
                        "password": password
                    },
                    success: function (res) {
                        console.log(res);
                        if (res.res == "success") {
                            window.location.href = "/";
                        } else if (res.res == "error") {
                            alert("Invalid Email or Password");
                            $("#submit_btn").prop("disabled", false);
                        }
                    },
                    error: function (res) {
                        console.log(res);
                    }
                })
            } else {
                alert('Please fill in all fields.');
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
