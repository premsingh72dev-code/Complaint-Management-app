<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <!-- Favicons -->
    <link href="static/img/facvicon.svg" rel="icon">
    <link href="static/img/facvicon.svg" rel="icon">

    <!-- Bootstrap & Swiper CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css" />

    <!-- Bootstrap & Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>

    <style>
        body {
            background: linear-gradient(to right, #667eea, #764ba2);
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            padding: 10px;
        }

        .header img {
            width: 80px;
            height: 80px;
            clip-path: circle(50%);
            object-fit: cover;
        }

        /* Login Container */
        .login-container {
            max-width: 950px;
            /* Increased width */
            margin: auto;
        }

        /* Swiper (Carousel) */
        .swiper {
            height: 100%;
        }

        .swiper-slide img {
            width: 100%;
            height: 350px;
            /* Increased height */
            object-fit: contain;
            display: block;
            margin: auto;
        }

        /* Form Container */
        .form-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px;
            height: 100%;
            text-align: center;
        }

        .form-container label {
            text-align: left;
            display: block;
            font-weight: bold;
        }

        /* Footer */
        footer {
            background-color: rgba(0, 0, 0, 0.1);
            color: white;
            padding: 15px 0;
        }

        .company-details {
            text-align: center;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .swiper-slide img {
                height: 250px;
            }

            .login-container {
                max-width: 100%;
                padding: 10px;
            }
        }
    </style>

    <!-- Vendor Files -->
    <script src="static/vendor/ajax/ajax.js"></script>
    <script src="static/vendor/jquery/jquery.js"></script>
</head>

<body class="d-flex flex-column min-vh-100 text-white">

    <!-- Header -->
    <div class="header">
        <img src="static/img/logo.jpg" alt="logo">
    </div>

    <!-- Marquee -->
    <marquee behavior="scroll" direction="left" scrollamount="8" loop="infinite">
        <h1 class="text-center">Welcome to Sahayata Complaint Management System</h1>
    </marquee>

    <!-- Login Section -->
    <div class="container my-3 login-container">
        <div class="row g-0 bg-light shadow rounded overflow-hidden align-items-center">

            <!-- Carousel / Images -->
            <div class="col-lg-6 d-none d-lg-block">
                <div class="swiper mySwiper w-100 h-100">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide"><img src="static/img/img_1.png" alt="Train Image 1"></div>
                        <div class="swiper-slide"><img src="static/img/img_2.jpg" alt="Train Image 2"></div>
                        <div class="swiper-slide"><img src="static/img/img_3.png" alt="Train Image 3"></div>
                        <div class="swiper-slide"><img src="static/img/img_4.jpg" alt="Train Image 4"></div>
                    </div>
                    <div class="swiper-pagination"></div>
                </div>
            </div>

            <!-- Login Form -->
            <div class="col-lg-6 form-container">

                <!-- ECR Logo -->
                <div class="text-center mb-4">
                    <img src="static/img/ecrlogo.jpeg" alt="ECR Logo" width="100" height="100" class="mb-3"
                        style="clip-path: circle(50%); object-fit: cover;">
                    <h2 class="text-dark">Master Login</h2>
                </div>

                <form id="loginForm" method="post">
                    <div class="mb-3">
                        <label class="form-label text-dark">Email:</label>
                        <input type="email" class="form-control" name="email" id="email" placeholder="Enter your email"
                            required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-dark">Password:</label>
                        <input type="password" class="form-control" name="password" id="password"
                            placeholder="Enter your password" required minlength="6">
                    </div>
                    <button id="submit_btn" type="submit" class="btn btn-primary w-100">Login</button>
                </form>

                <div class="text-end mt-2">
                    <a href="/forgetpassword" class="text-primary">Forgot Password?</a>
                </div>

            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-auto text-center">
        <div class="company-details">
            <p><b>In association with Danapur Division</b></p>
            <span><b>Powered By <a href="mailto:anshjha@photonstar.in">Photon Star</a></b></span>
            <b><span>&copy; <span id="yearname"></span>. All rights reserved.</span></b>
        </div>
    </footer>

    <!-- JavaScript -->
    <script>
        // Dynamic Year
        document.getElementById("yearname").textContent = new Date().getFullYear();

        // Swiper JS Initialization
        var swiper = new Swiper(".mySwiper", {
            loop: true,
            autoplay: {
                delay: 3000,
                disableOnInteraction: false,
            },
            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },
        });

        // Form Submission
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            $("#submit_btn").prop("disabled", true);

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (email && password) {
                $.ajax({
                    url: "/loginverification",
                    method: "POST",
                    dataType: "json",
                    data: { "email": email, "password": password },
                    success: function (res) {
                        if (res.res == "success") {
                            window.location.href = "/";
                        } else {
                            alert("Invalid Email or Password");
                            $("#submit_btn").prop("disabled", false);
                        }
                    },
                    error: function () {
                        alert("An error occurred. Please try again.");
                        $("#submit_btn").prop("disabled", false);
                    }
                });
            } else {
                alert('Please fill in all fields.');
            }
        });
    </script>

</body>

</html>
